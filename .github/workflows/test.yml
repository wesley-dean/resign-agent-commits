---
name: Test

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check, build, and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl doxygen gh graphviz make shellcheck shfmt

      - name: Verify build does not acquire dependencies
        run: |
          test ! -e vendor
          stderr="${RUNNER_TEMP}/build.stderr"
          if make build >/dev/null 2>"$stderr"; then
            printf '%s\n' 'make build unexpectedly succeeded without dependencies' >&2
            exit 1
          fi
          grep -F 'Missing build dependency vendor/bash-minifier.bash' "$stderr"
          test ! -e vendor

      - name: Validate maintained source
        run: make check

      - name: Synchronize and verify repository dependencies
        run: |
          make deps
          make deps-check
          test -f vendor/bash-minifier.bash
          test -f vendor/doxygen-bash.awk
          test -f vendor/bashlog.dev.bash
          test -f vendor/adrctl.bash

      - name: Build release artifacts
        run: make build VERSION=0.0.0-ci

      - name: Verify six executables and twelve release files
        shell: bash
        run: |
          mapfile -t executables < <(
            find dist -maxdepth 1 -type f -name '*.bash' -perm -u+x -print | sort
          )
          test "${#executables[@]}" -eq 6

          shopt -s nullglob
          files=(dist/*)
          test "${#files[@]}" -eq 12

          for artifact in "${executables[@]}"; do
            bash -n "$artifact"
            test -f "$artifact.sha256"
            test ! -e "$artifact.256"
            (cd dist && sha256sum -c "$(basename "$artifact").sha256")
          done

          for dev in dist/*.dev.bash; do
            grep -Fq '# Generated by make build. Do not edit directly.' "$dev"
          done

          for ordinary in dist/list_repos.bash dist/resign_commits.bash; do
            if grep -Fq '# Generated by make build. Do not edit directly.' "$ordinary"; then
              printf '%s\n' "ordinary artifact retained generated comments: $ordinary" >&2
              exit 1
            fi
          done

          ! cmp -s dist/list_repos.bash dist/list_repos.min.bash
          ! cmp -s dist/resign_commits.bash dist/resign_commits.min.bash

      - name: Verify deterministic build output
        run: |
          mkdir -p "${RUNNER_TEMP}/first-build"
          cp dist/*.bash "${RUNNER_TEMP}/first-build/"
          for artifact in dist/*.bash; do
            : >"$artifact.256"
          done
          make build VERSION=0.0.0-ci
          for artifact in dist/*.bash; do
            cmp "${RUNNER_TEMP}/first-build/$(basename "$artifact")" "$artifact"
            test -f "$artifact.sha256"
            test ! -e "$artifact.256"
          done

      - name: Generate documentation from prepared dependencies
        run: |
          make docs
          make deps-check
          test -f doc/adr/README.md
          grep -Fq 'ADR-018: Two-Command Repository Discovery' doc/adr/README.md
          git check-ignore -q doc/adr/README.md
          test -f doc/reference/index.html
          git check-ignore -q doc/reference/index.html
          test -z "$(git status --short)"

      - name: Run live GitHub dry-run integration smoke test
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_BRANCH: ${{ github.head_ref }}
        run: |
          tests/github-integration.bash \
            dist/list_repos.bash \
            dist/resign_commits.bash \
            "$TEST_BRANCH"

      - name: Run Bats tests for every executable flavor
        id: bats
        continue-on-error: true
        run: make test-report VERSION=0.0.0-ci

      - name: Publish Bats test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        with:
          name: Bats tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: true

      - name: Verify artifacts are independent of vendor state
        if: steps.bats.outcome == 'success'
        run: |
          rm -rf vendor
          for artifact in dist/*.bash; do
            "$artifact" --help >/dev/null
          done

      - name: Fail if Bats failed
        if: steps.bats.outcome == 'failure'
        run: exit 1

  bash43:
    name: Bash 4.3 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install dependency bootstrap requirements
        run: sudo apt-get update && sudo apt-get install --yes curl make

      - name: Prepare dependencies and build
        run: make all VERSION=0.0.0-ci

      - name: Validate all executable artifacts under Bash 4.3
        run: |
          for artifact in dist/*.bash; do
            docker run --rm \
              --env RAC_ARTIFACT="/work/$artifact" \
              --volume "${GITHUB_WORKSPACE}:/work:ro" \
              --workdir /work \
              bash:4.3 \
              bash tests/compat-bash43.bash
          done
